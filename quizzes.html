<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank Quiz | PembelajarBelajar</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .quiz-card-link {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .quiz-card-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--primary-color);
        }

        .quiz-number {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .quiz-title {
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
        }

        .quiz-status {
            margin-top: 10px;
            font-size: 0.85em;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #f0f0f0;
            color: #666;
            text-align: center;
            align-self: flex-start;
        }
    </style>
</head>

<body>
    <main class="container">
        <button class="dark-toggle">🌙</button>

        <header class="header">
            <span class="badge">Bank Soal</span>
            <h1>Quiz Center</h1>
            <p class="subtitle">
                Akses langsung ke semua quiz materi Odoo.
            </p>
        </header>

        <section>
            <h2 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">Daftar Quiz</h2>
            <div class="quiz-grid" id="quizGrid">
                <!-- Quiz Cards will be generated here -->
            </div>
        </section>

        <footer class="footer">
            <a href="./index.html" style="text-decoration: none; color: #666; font-weight: 600">← Kembali ke Halaman
                Utama</a>
        </footer>
    </main>

    <script src="./assets/js/lms-core.js"></script>
    <script>
        const quizList = [
            { id: 1, title: "Memulai Odoo", topic: "Basics" },
            { id: 2, title: "Antarmuka Odoo", topic: "Navigation" },
            { id: 3, title: "Google Calendar", topic: "Integration" },
            { id: 4, title: "Filter & Tampilan", topic: "Productivity" },
            { id: 5, title: "Multi-Company", topic: "Configuration" },
            { id: 6, title: "Transaksi Antar-Perusahaan", topic: "Advanced" },
            { id: 7, title: "Meeting Scheduling", topic: "Calendar" },
            { id: 8, title: "Schedule Activities", topic: "Productivity" },
            { id: 9, title: "Contacts Management", topic: "CRM" },
            { id: 10, title: "Import Data", topic: "Utilities" },
            { id: 11, title: "Chatter Basic", topic: "Communication" },
            { id: 12, title: "Canned Responses", topic: "Communication" },
            { id: 13, title: "Digest Emails", topic: "Reporting" },
            { id: 14, title: "Custom Digest", topic: "Reporting" },
            { id: 15, title: "Access Rights", topic: "Security" },
            { id: 16, title: "Odoo Discuss", topic: "App Overview" },
            { id: 17, title: "Inbox & Calls", topic: "Communication" },
            { id: 18, title: "Channels & Privacy", topic: "Communication" },
            { id: 19, title: "WhatsApp Integration", topic: "Integration" },
            { id: 20, title: "WhatsApp Config", topic: "Configuration" },
            { id: 21, title: "Sales to Invoice", topic: "Business Flow" },
            { id: 22, title: "Events & Social", topic: "Marketing" },
            { id: 23, title: "Planning & POS", topic: "Operations" },
            { id: 24, title: "eLearning", topic: "Website" },
            { id: 25, title: "Subscriptions", topic: "Sales" },
            { id: 26, title: "Documents", topic: "Produkctivity" },
            { id: 27, title: "Timesheets", topic: "Services" },
            { id: 28, title: "Manufacturing", topic: "Inventory" },
        ];

        const grid = document.getElementById('quizGrid');

        quizList.forEach(quiz => {
            const card = document.createElement('a');
            card.href = `./quizzes/play.html?id=materi${quiz.id}`;
            card.className = 'quiz-card-link';

            card.innerHTML = `
                <div>
                    <div class="quiz-number">Materi ${quiz.id}</div>
                    <div class="quiz-title">${quiz.title}</div>
                    <small style="color: #888;">${quiz.topic}</small>
                </div>
                <div class="quiz-status">Mulai Quiz</div>
            `;
            grid.appendChild(card);
        });

        // Dark mode toggle (Standard logic)
        const toggle = document.querySelector(".dark-toggle");
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            toggle.textContent = "☀️";
        }
        toggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            toggle.textContent = isDark ? "☀️" : "🌙";
        });
    </script>
</body>

</html>
